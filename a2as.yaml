      returns: str
  read_accounts_resource:
    type: async
    module: src.accounts_client
    args: [name]
  read_log:
    type: sync
    module: src.database
    args: [name, last_n]
  read_market:
    type: sync
    module: src.database
    args: [date]
  read_strategy_resource:
    type: async
    module: src.accounts_client
