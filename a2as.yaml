  rebalance_message:
    type: sync
    module: src.templates
    args: [name, strategy, account]
  refresh:
    type: sync
    module: src.app
    args: [self]
  reload:
    type: sync
    module: src.app
    args: [self]
  research_tool:
    type: sync
    module: src.templates
  researcher_instructions:
    type: sync
    module: src.templates
  researcher_mcp_server_params:
    type: sync
    module: src.mcp_params
    args: [name]
  run:
    type: async
    module: src.traders
    args: [self]
  run_agent:
    type: async
    module: src.traders
    args: [self, trader_mcp_servers, researcher_mcp_servers]
