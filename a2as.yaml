variables:
  BRAVE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.mcp_params]
  DEEPSEEK_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.traders]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.traders]
  GROK_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.traders]
  OPENROUTER_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.traders]
  POLYGON_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.market, src.mcp_params]
  POLYGON_PLAN:
    type: env
    params:
      caller: [os.getenv]
      path: [src.market]
  PUSHOVER_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [src.push_server]
  PUSHOVER_USER:
    type: env
    params:
      caller: [os.getenv]
      path: [src.push_server]
  RUN_EVEN_WHEN_MARKET_IS_CLOSED:
    type: env
    params:
      caller: [os.getenv]
      path: [src.trading_floor]
  RUN_EVERY_N_MINUTES:
    type: env
    params:
      caller: [os.getenv]
      path: [src.trading_floor]
  USE_MANY_MODELS:
    type: env
    params:
      caller: [os.getenv]
      path: [src.trading_floor]

processes:
  uv:
    type: mcp
    actions: [exec]
    args: [[run, accounts_server.py]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]

networks:
  api.deepseek.com:
    type: api
    actions: [GET]
    urls: [/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [AsyncOpenAI]
  api.pushover.net:
    type: api
    actions: [POST]
    urls: [/1/messages.json]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [push]
  api.x.ai:
    type: api
    actions: [GET]
    urls: [/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [AsyncOpenAI]
  generativelanguage.googleapis.com:
    type: api
    actions: [GET]
    urls: [/v1beta/openai/]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [AsyncOpenAI]
  openrouter.ai:
    type: api
    actions: [GET]
    urls: [/api/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [AsyncOpenAI]
